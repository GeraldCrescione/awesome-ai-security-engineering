  # ------------------------------------------------------------------ research and benchmarks
  - id: vulnbench
    name: Snyk VulnBench
    url: https://vulnbench.com/
    source: https://github.com/snyk-labs/snyk-vulnbench
    summary: Benchmark and study of how repeatable LLM-based vulnerability findings are, versus a deterministic SAST reference.
    description: >-
      Repeats the same agentic security review five times per configuration on ten small JavaScript
      projects (six model configurations, 300 scans) and compares findings with a Snyk Code reference set.
      Published results: 134 of 158 reference-matched findings (84.8%) appeared in all five runs; 80 of 161
      unmatched findings (49.7%) appeared in only one run. See research/vulnbench.md for methodology and limits.
    type: Benchmark
    lifecycle: [build, break, defend]
    domains: [ai-assisted-dev, red-teaming]
    license: Apache-2.0
    license_note: Harness repository LICENSE read directly; the companion data repository snyk-labs/snyk-vulnbench-js-1.0 is also Apache-2.0 per a delegated check.
    license_evidence: https://raw.githubusercontent.com/snyk-labs/snyk-vulnbench/main/LICENSE
    maintainer: Snyk (snyk-labs)
    last_release: "JS 1.0, published 2026-06-11"
    verification: verified
    verified_by: direct
    verified_on: 2026-10-18
    disclosure: Created by Snyk, which also supports the AI Security Engineers Community. Listed under the same criteria as every other entry.
    notes: The reference set is Snyk Code, so "match" means agreement with that tool, not ground truth. Other projects share the name VulnBench; this entry is vulnbench.com / snyk-labs.

  - id: cyberseceval
    name: CyberSecEval (Purple Llama)
    url: https://meta-llama.github.io/PurpleLlama/CyberSecEval/
    source: https://github.com/meta-llama/PurpleLlama/tree/main/CybersecurityBenchmarks
