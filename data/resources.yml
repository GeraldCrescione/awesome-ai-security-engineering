# Single source of truth for every published resource.
# Edit this file, then run `python scripts/generate.py` and `python scripts/validate.py`.
# Schema and allowed values are enforced by scripts/validate.py.
#
# verified_by: direct   = a maintainer-run check read the primary source (LICENSE file / official page).
# verified_by: delegated = the primary source was read by a delegated research pass; spot-check welcome.
# last_release is the latest release/version evidence found on the verification date, not a promise of maintenance.

resources:
  # ------------------------------------------------------------------ frameworks, standards
  - id: owasp-genai-security-project
    name: OWASP GenAI Security Project
    url: https://genai.owasp.org/
    source: https://github.com/GenAI-Security-Project
    summary: Umbrella OWASP project for LLM and agentic AI security guidance, cheat sheets and initiatives.
    description: >-
      OWASP project that publishes the LLM Top 10 (2025 edition and a 2026 edition), the Top 10 for
      Agentic Applications, cheat sheets, an AI red-teaming initiative and other guidance. Useful as the
      shared vocabulary for AI-specific risks.
    type: Open Security Framework
    lifecycle: [design, break]
    domains: [llm-model, agentic, governance-controls]
    license: CC-BY-SA-4.0
    license_note: Site-wide statement ("unless otherwise specified"); individual repositories may differ. Share-alike applies if you reuse the text.
    license_evidence: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
    maintainer: OWASP Foundation
    last_release: "2026-08-03 (LLM Top 10 2026 v1.0 listed on project resources)"
    verification: verified
    verified_by: direct
    verified_on: 2026-10-18
    notes: Guidance documents, not software. Check the license of each individual artifact before reuse.

  - id: owasp-top10-agentic-2026
    name: OWASP Top 10 for Agentic Applications 2026
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
    source: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
    summary: Peer-reviewed list of the ten most critical risks for autonomous, tool-using AI agents.
    description: >-
      Risk list for AI agents that plan, act and make decisions across workflows, such as goal hijack,
      tool misuse and identity abuse. The project page states it was developed with more than 100
      industry experts, researchers and practitioners and was published on 2025-12-09.
    type: Open Security Framework
    lifecycle: [design, break]
    domains: [agentic, agent-identity, governance-controls]
    license: CC-BY-SA-4.0
    license_note: From the site-wide license statement on genai.owasp.org.
    license_evidence: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
    maintainer: OWASP GenAI Security Project
    last_release: "2025-12-09"
    verification: verified
    verified_by: direct
    verified_on: 2026-10-18
    notes: A risk taxonomy, not a control catalogue. Treat it as a threat-modeling input.

  - id: mitre-atlas
    name: MITRE ATLAS
    url: https://atlas.mitre.org/
    source: https://github.com/mitre-atlas/atlas-data
    summary: Knowledge base of adversary tactics, techniques and case studies against AI-enabled systems.
    description: >-
      Matrix of tactics, techniques, mitigations and real-world case studies for attacks on AI systems,
      distributed as YAML and STIX data with Navigator support. Modeled on MITRE ATT&CK.
    type: Open Security Framework
    lifecycle: [design, break]
    domains: [llm-model, agentic, governance-controls]
    license: Apache-2.0
    license_note: Applies to the atlas-data repository. Website terms were not separately verified.
    license_evidence: https://github.com/mitre-atlas/atlas-data
    maintainer: MITRE
    last_release: "2026-09-14 (content version 2026.09)"
    verification: verified
    verified_by: delegated
    verified_on: 2026-10-18
    notes: Single-organization governance. Contributions arrive through GitHub.

  - id: model-context-protocol
    name: Model Context Protocol (MCP)
    url: https://modelcontextprotocol.io/
    source: https://github.com/modelcontextprotocol/modelcontextprotocol
    summary: Open protocol connecting AI applications to tools and data, with an OAuth-based authorization model.
    description: >-
      Client/server protocol for exposing tools, resources and prompts to AI applications. The
      specification includes an authorization section and security considerations that define trust
      boundaries between hosts, clients and servers. Current spec revision found: 2026-07-28.
    type: Open Standard / Protocol
    lifecycle: [design, build]
    domains: [mcp-skills, agent-identity]
    license: Apache-2.0 (spec, in transition from MIT); CC-BY-4.0 (non-spec docs)
    license_note: The repository LICENSE describes a transition from MIT to Apache-2.0; older contributions may remain MIT.
    license_evidence: https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/LICENSE
    maintainer: Model Context Protocol, a Series of LF Projects, LLC (Linux Foundation; Agentic AI Foundation)
    last_release: "2026-07-28 (spec revision)"
    verification: verified
    verified_by: delegated
    verified_on: 2026-10-18
    notes: Maintainer-led governance (SEP process). A protocol, not a security control; its security model is only as good as each implementation.

  - id: cyclonedx
    name: CycloneDX
    url: https://cyclonedx.org/
    source: https://github.com/CycloneDX/specification
    summary: Bill-of-materials standard (ECMA-424) with ML-BOM support for models and datasets.
    description: >-
      Full-stack BOM specification for software, services and ML components. Its ML-BOM capability lets
      teams inventory models and datasets alongside code dependencies; the format is standardized as
      ECMA-424.
    type: Open Standard / Protocol
    lifecycle: [discover, build]
    domains: [supply-chain, governance-controls]
    license: Apache-2.0
    license_note: Schemas under Apache-2.0; ECMA-424 is published under Ecma's royalty-free patent policy.
    license_evidence: https://raw.githubusercontent.com/CycloneDX/specification/master/README.md
    maintainer: OWASP Foundation; Ecma TC54
    last_release: "2025-10-21 (spec 1.7)"
    verification: verified
    verified_by: delegated
    verified_on: 2026-10-18
    notes: Which spec version introduced ML-BOM was not confirmed; check the spec history before citing it.

  - id: cosai-ws4-secure-design-agentic
    name: CoSAI Secure Design Patterns for Agentic Systems
    url: https://www.coalitionforsecureai.org/
    source: https://github.com/cosai-oasis/ws4-secure-design-agentic-systems
    summary: OASIS-hosted whitepapers and design patterns for MCP security and agentic identity and access management.
    description: >-
      Coalition for Secure AI (an OASIS Open Project) workstream 4 repository with whitepapers on MCP
      security and agentic identity and access management, plus design-pattern content for secure
      agentic systems.
    type: Reference Implementation
    lifecycle: [design]
    domains: [agentic, mcp-skills, agent-identity]
    license: CC-BY-4.0
    license_note: LICENSE.md also carries an OASIS non-assertion covenant.
    license_evidence: https://raw.githubusercontent.com/cosai-oasis/ws4-secure-design-agentic-systems/main/LICENSE.md
    maintainer: CoSAI (OASIS Open)
    last_release: "repository updated 2026-08-26 (no tagged release)"
    verification: verified
    verified_by: delegated
    verified_on: 2026-10-18
    notes: Reference content (papers and patterns), not deployable code.

  - id: opentelemetry-genai-semconv
    name: OpenTelemetry GenAI Semantic Conventions
    url: https://opentelemetry.io/docs/specs/semconv/gen-ai/
    source: https://github.com/open-telemetry/semantic-conventions
    summary: Vendor-neutral span, metric and attribute conventions for tracing GenAI calls, agents and tool use.
    description: >-
      Standard attribute and span definitions (for example agent invocation and tool-call spans) so that
      agent activity can be traced with ordinary OpenTelemetry pipelines. Provides the telemetry that
      runtime monitoring and incident investigation depend on.
    type: Open Standard / Protocol
    lifecycle: [defend]
    domains: [runtime, agentic]
    license: Apache-2.0
    license_note: Repository code and schemas are Apache-2.0; the opentelemetry.io docs are CC-BY-4.0. The GenAI conventions are moving to github.com/open-telemetry/semantic-conventions-genai, whose license file was not read.
    license_evidence: https://raw.githubusercontent.com/open-telemetry/semantic-conventions/main/LICENSE
    maintainer: OpenTelemetry (CNCF)
    last_release: "semconv 1.44.0 (date not verified)"
    verification: partial
    verified_by: delegated
    verified_on: 2026-10-18
    notes: Maturity (stable vs. development) of the GenAI conventions was not confirmed. It is an observability standard, not a security control.

  - id: sigstore-model-transparency
    name: Sigstore model-transparency (model-signing)
    url: https://www.sigstore.dev/
    source: https://github.com/sigstore/model-transparency
    summary: Python library and CLI for signing and verifying ML model artifacts with Sigstore.
    description: >-
      Signs and verifies model files so consumers can check integrity and provenance before loading them.
      Supports Sigstore keyless signing as well as key- and certificate-based signing, with in-toto/DSSE bundles.
    type: Open-Source Tool
    lifecycle: [build]
    domains: [supply-chain]
    license: Apache-2.0
    license_note: Built with OpenSSF.
    license_evidence: https://github.com/sigstore/model-transparency
    maintainer: Sigstore community / OpenSSF
    last_release: "v1.0 announced 2025-04-04"
    verification: verified
    verified_by: delegated
    verified_on: 2026-10-18
    notes: Signing proves who published a model, not that the model is safe.

  - id: open-policy-agent
    name: Open Policy Agent (OPA)
    url: https://www.openpolicyagent.org/
    source: https://github.com/open-policy-agent/opa
    summary: General-purpose policy engine (Rego) for deterministic authorization and policy-as-code.
    description: >-
      CNCF graduated policy engine used to express and enforce authorization and guardrail rules as code.
      Not AI-specific; included as the deterministic control layer that AI agents' tool permissions can be
      checked against.
    type: Open-Source Tool
    lifecycle: [design, defend]
    domains: [agent-identity, governance-controls, runtime]
    license: Apache-2.0
    license_note: ""
    license_evidence: https://github.com/open-policy-agent/opa
    maintainer: CNCF project (original creators now employed by Apple; the project states governance and licensing are unchanged)
    last_release: "v1.21.2 (12 Oct, year inferred as 2026)"
    verification: verified
    verified_by: delegated
    verified_on: 2026-10-18
    notes: Foundational security tool rather than an AI tool. Stewardship changed in 2025-2026; review the project's own statement.

