    maintainer: Confident AI
    last_release: "1.0.10 (2026-10-16, PyPI)"
    verification: verified
    verified_by: direct
    verified_on: 2026-10-18
    notes: The LICENSE.md appendix keeps the unfilled "[yyyy] [name of copyright owner]" template text; PyPI and the README both state Apache-2.0.

  # ------------------------------------------------------------------ agent skills / MCP / discovery
  - id: snyk-agent-scan
    name: Snyk Agent Scan
    url: https://github.com/snyk/agent-scan
    source: https://github.com/snyk/agent-scan
    summary: Discovers agent configurations, MCP servers and skills; deeper security analysis uses a Snyk-hosted API (open core).
    description: >-
      Command-line scanner (formerly MCP-Scan) for agent setups. The client source is Apache-2.0 and its
      `inspect` command lists discovered components locally without analysis. Security analysis of tool
      descriptions, skill content and MCP configs requires a Snyk API token and sends that content to a
      hosted service governed by separate terms of use.
    type: Open-Source Tool
    lifecycle: [discover, build]
    domains: [mcp-skills, supply-chain, ai-assisted-dev]
    license: Apache-2.0
    license_note: Client source is Apache-2.0 (LICENSE copyright "Invariant Labs AG"). Open core - the analysis service is not open source and needs a token.
    license_evidence: https://raw.githubusercontent.com/snyk/agent-scan/main/LICENSE
    maintainer: Snyk
    last_release: "not verified"
    verification: partial
    verified_by: direct
    verified_on: 2026-10-18
    disclosure: Created and maintained by Snyk, which also supports the AI Security Engineers Community. Listed as open core only; the hosted analysis is a commercial dependency.
    notes: README read on the verification date. Release cadence and LICENSE file were not re-checked in this pass. Only local discovery works without a Snyk account; compare with the fully open alternatives agent-bom and Cisco Skill Scanner.

