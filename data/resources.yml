    lifecycle: [break]
    domains: [llm-model, red-teaming]
    license: Apache-2.0
    license_note: ""
    license_evidence: https://raw.githubusercontent.com/NVIDIA/garak/main/LICENSE
    maintainer: NVIDIA
    last_release: "0.17.1 (2026-10-16, PyPI)"
    verification: verified
    verified_by: direct
    verified_on: 2026-10-18
    notes: Scan results are probabilistic; repeat runs before drawing conclusions.

