  - name: CyberGym
    url: https://github.com/sunblaze-ucb/cybergym
    license_found: Apache-2.0 (code, per README); dataset license not verified
    decision: backlog
    reason: Qualifying vulnerability-reproduction benchmark (arXiv 2506.02548). Deferred; roughly 240 GB of data and dataset license unverified.
    evidence: https://github.com/sunblaze-ucb/cybergym
    checked_on: 2026-10-18

  - name: BountyBench
    url: https://github.com/bountybench/bountybench
    license_found: Apache-2.0
    decision: backlog
    reason: Qualifying detect/exploit/patch evaluation on real systems; paper not verified. Deferred to keep the first list curated.
    evidence: https://raw.githubusercontent.com/bountybench/bountybench/main/LICENSE
    checked_on: 2026-10-18

  - name: CVE-Bench
    url: https://github.com/uiuc-kang-lab/cve-bench
    license_found: Apache-2.0
    decision: backlog
    reason: Qualifying benchmark for agent exploitation of real web-application CVEs (arXiv 2503.17332). Deferred.
    evidence: https://raw.githubusercontent.com/uiuc-kang-lab/cve-bench/main/LICENSE
    checked_on: 2026-10-18

  - name: inspect_evals
    url: https://github.com/UKGovernmentBEIS/inspect_evals
    license_found: MIT (per-eval dataset licenses vary)
    decision: backlog
    reason: Collection of evaluations on Inspect AI; dataset licenses are per evaluation and were not audited.
    evidence: https://raw.githubusercontent.com/UKGovernmentBEIS/inspect_evals/main/LICENSE
    checked_on: 2026-10-18

  - name: Caracal
    url: https://github.com/Garudex-Labs/caracal
    license_found: Apache-2.0
    decision: hold
    reason: Authority layer for agents (policy-based authorization, delegation, revocation, approvals). Version 1.0.0 only since 2026-08-09; needs more track record.
    evidence: https://raw.githubusercontent.com/Garudex-Labs/caracal/main/LICENSE
    checked_on: 2026-10-18

  - name: ZeroID
    url: https://github.com/highflame-ai/zeroid
    license_found: Apache-2.0
    decision: hold
    reason: Agent identity server (OAuth 2.1, token exchange). Vendor-maintained; open-core boundary and competitor status not assessed.
    evidence: https://raw.githubusercontent.com/highflame-ai/zeroid/main/LICENSE
    checked_on: 2026-10-18

  - name: agentgateway
    url: https://github.com/agentgateway/agentgateway
    license_found: Apache-2.0 (copyright Solo.io, Inc.)
    decision: hold
    reason: Proxy for agent, MCP and LLM traffic. Policy and authorization features were described only in search snippets; README not read.
    evidence: https://raw.githubusercontent.com/agentgateway/agentgateway/main/LICENSE
    checked_on: 2026-10-18

  - name: Cisco mcp-scanner
    url: https://github.com/cisco-ai-defense/mcp-scanner
