    decision: hold
    reason: No LICENSE file found at the default branch.
    evidence: https://github.com/uiuc-kang-lab/InjecAgent
    checked_on: 2026-10-18

  - name: MCP-SafetyBench
    url: https://github.com/xjzzzzzzzz/MCPSafety
