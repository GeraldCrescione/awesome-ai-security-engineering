# Candidates that were evaluated but are NOT in the public list.
# decision: exclude  = fails an eligibility rule (see reason)
#           hold     = may qualify later; needs a fact, a maintainer decision, or more track record
#           backlog  = verified and qualifying, deferred to keep the first release curated (<= 30)
# checked_on is the date the evidence below was gathered.

candidates:

  - name: LLM Guard
    url: https://github.com/protectai/llm-guard
    license_found: MIT
    decision: exclude
    reason: Repository archived by its owner on 2026-07-09; README states it is no longer maintained.
    evidence: https://github.com/protectai/llm-guard
    checked_on: 2026-10-18

  - name: Meta Purple Llama (repository as a whole)
    url: https://github.com/meta-llama/PurpleLlama
    license_found: Llama 3.2 Community License at repository root; MIT for CybersecurityBenchmarks and CodeShield
    decision: exclude
    reason: >-
      Repository root is not an OSI-approved license. Only the CyberSecEval benchmark component is listed
      (see resources.yml). Llama Guard and Prompt Guard are models under Llama licenses and are not listed.
    evidence: https://raw.githubusercontent.com/meta-llama/PurpleLlama/main/LICENSE ; https://raw.githubusercontent.com/meta-llama/PurpleLlama/main/README.md
    checked_on: 2026-10-18

  - name: NIST AI Risk Management Framework (AI RMF 1.0, AI 600-1)
    url: https://www.nist.gov/itl/ai-risk-management-framework
    license_found: Not verified (voluntary guidance; US government publication)
    decision: exclude
    reason: >-
      Risk-governance guidance without an open repository or implementable specification; NIST states a
      revision is under way. Does not meet the open-standard bar in the project criteria. Referenced as
      context in foundations/frameworks-and-standards.md rather than listed.
    evidence: https://www.nist.gov/itl/ai-risk-management-framework
    checked_on: 2026-10-18

  - name: Giskard
    url: https://github.com/Giskard-AI/giskard
    license_found: Apache-2.0
    decision: hold
    reason: >-
      Library is Apache-2.0 and active (3.0.1 released 2026-10-02) but the security-testing functionality
      that is open source in v3 was not verified; the vendor also offers a commercial hub.
    evidence: https://raw.githubusercontent.com/Giskard-AI/giskard/main/LICENSE ; https://pypi.org/project/giskard/
    checked_on: 2026-10-18

  - name: Agent Security Bench (ASB)
    url: https://github.com/agiresearch/ASB
    license_found: MIT
    decision: hold
    reason: Qualifies as research (ICLR 2025, arXiv 2410.02644) but maintenance could not be verified and the README clone URL points to a different organization.
    evidence: https://raw.githubusercontent.com/agiresearch/ASB/main/LICENSE
    checked_on: 2026-10-18

  - name: Adversarial Robustness Toolbox (ART)
    url: https://github.com/Trusted-AI/adversarial-robustness-toolbox
    license_found: MIT
    decision: hold
    reason: Relevant to classical adversarial ML; latest PyPI release 1.20.1 is dated 2025-07-07, more than 12 months old. Recheck repository activity.
    evidence: https://raw.githubusercontent.com/Trusted-AI/adversarial-robustness-toolbox/main/LICENSE ; https://pypi.org/project/adversarial-robustness-toolbox/
    checked_on: 2026-10-18

  - name: OWASP Juice Shop
    url: https://github.com/juice-shop/juice-shop
    license_found: MIT
    decision: exclude
    reason: Qualifies on license and maintenance but is a general web AppSec training target, not AI-specific.
    evidence: https://raw.githubusercontent.com/juice-shop/juice-shop/master/LICENSE
    checked_on: 2026-10-18

  - name: Damn Vulnerable MCP Server
    url: https://github.com/harishsg993010/damn-vulnerable-MCP-server
    license_found: README claims MIT; no LICENSE file confirmed
    decision: hold
    reason: Popular MCP challenge lab, but a README-only license claim fails the verification rule. Recheck for a LICENSE file.
    evidence: https://github.com/harishsg993010/damn-vulnerable-MCP-server
    checked_on: 2026-10-18

  - name: InjecAgent
    url: https://github.com/uiuc-kang-lab/InjecAgent
