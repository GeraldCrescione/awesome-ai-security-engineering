name: Links and freshness

# Weekly review aid. This workflow only reports; it never edits or removes entries.
# It keeps ONE open issue per report: it updates that issue when it exists,
# creates it when it does not, and closes it when the report comes back clean.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress "**/*.md" "data/resources.yml" "maintainers/candidates.yml"
          output: lychee-report.md
          fail: false

      - name: Create, update or close the link check issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Link check report
          LABEL: broken-link
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          existing=$(gh issue list --label "$LABEL" --state open --search "\"$TITLE\" in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$EXIT_CODE" != "0" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file lychee-report.md
              gh issue comment "$existing" --body "Report refreshed by the weekly run on $(date -u +%F)."
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body-file lychee-report.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --reason completed --comment "No broken links in the weekly run on $(date -u +%F)."
          fi

  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Report stale or partially verified entries
        run: python scripts/validate.py | tee freshness.txt || true

      - name: Create, update or close the re-verify issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Entries to re-verify
          LABEL: update-entry
        run: |
          existing=$(gh issue list --label "$LABEL" --state open --search "\"$TITLE\" in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if grep -q '^WARN' freshness.txt; then
            grep '^WARN' freshness.txt > body.md
            if [ -n "$existing" ]; then
              # Only touch the issue if the list of warnings changed, to avoid noise.
              if [ "$(gh issue view "$existing" --json body --jq .body | tr -d '\r')" != "$(cat body.md)" ]; then
                gh issue edit "$existing" --body-file body.md
                gh issue comment "$existing" --body "Warnings changed in the weekly run on $(date -u +%F); issue body updated."
              fi
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --reason completed --comment "No warnings in the weekly run on $(date -u +%F)."
          fi
