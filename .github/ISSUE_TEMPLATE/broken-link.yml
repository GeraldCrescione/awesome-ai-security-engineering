name: Report a broken link
description: A link in the list returns an error or points to the wrong place.
title: "[Link] "
labels: ["broken-link"]
body:
  - type: input
    id: url
    attributes:
      label: Broken URL
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where is it? (file and entry name)
    validations:
      required: true
  - type: textarea
    id: replacement
    attributes:
      label: Replacement URL or what you found
      description: For example, the project moved, was renamed or was archived.
